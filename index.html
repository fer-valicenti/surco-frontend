<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surco — gestión agropecuaria de campo</title>
    <meta
      name="description"
      content="Surco: órdenes de trabajo, scouting, ganadería y calibración de maquinaria con captura offline-first."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#C1603C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Surco" />
    <!--
      Servido tal cual desde public/, sin pasar por el bundler: el
      minificador CSS de Vite (Lightning CSS) corrompe las reglas de este
      archivo (los íconos de la barra de dibujo son SVG inline como
      data-URI larguísimos en una sola línea) y termina vaciando
      background-image en producción — los botones de "dibujar polígono"
      quedaban en blanco, sin ícono, aunque funcionaban al tacto. Cargarlo
      sin procesar evita el bug del minificador. Si se actualiza la
      versión de @geoman-io/leaflet-geoman-free, hay que volver a copiar
      node_modules/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.css
      a public/leaflet-geoman.css a mano.
    -->
    <link rel="stylesheet" href="/leaflet-geoman.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
