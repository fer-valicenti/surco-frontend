<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surco · Home móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink-900: #16302A;
    --ink-800: #1F3D34;
    --ink-700: #2E4A40;
    --paper: #F5F1E8;
    --paper-raised: #FFFFFF;
    --clay: #C1603C;
    --clay-dark: #A34F31;
    --wheat-gold: #C99A34;
    --sprout: #4C8F5B;
    --line: rgba(22,48,42,0.12);
    --ink-on-dark: #F2EFE6;
    --muted-on-dark: rgba(242,239,230,0.62);
    --muted-on-paper: rgba(22,48,42,0.60);
    --tone-blue: #4E7C8B;      --tone-blue-bg: #E4EEEF;
    --tone-amber: #A97A2E;     --tone-amber-bg: #F7EDD9;
    --tone-green: #4C8F5B;     --tone-green-bg: #E6F1E8;
    --tone-red: #B15A42;       --tone-red-bg: #F5E4DE;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    background:
      radial-gradient(circle at 30% 20%, rgba(22,48,42,0.10), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(193,96,60,0.08), transparent 50%),
      #EAE6DB;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  /* ---------- Phone frame ---------- */
  .phone {
    position: relative;
    width: 402px;
    padding: 13px;
    border-radius: 52px;
    background: linear-gradient(160deg, #14211D, #0A0F0D);
    box-shadow:
      0 40px 80px rgba(10,20,16,0.45),
      0 10px 24px rgba(10,20,16,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  .notch {
    position: absolute;
    top: 13px; left: 50%;
    transform: translateX(-50%);
    width: 126px; height: 30px;
    background: #0A0F0D;
    border-radius: 0 0 18px 18px;
    z-index: 6;
  }

  .home-indicator {
    position: absolute;
    bottom: 9px; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 5px;
    border-radius: 4px;
    background: rgba(255,255,255,0.28);
    z-index: 6;
  }

  .screen {
    position: relative;
    width: 376px;
    height: 812px;
    background: var(--paper);
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Status bar ---------- */
  .statusbar {
    height: 46px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    color: var(--ink-on-dark);
    font-size: 14px;
    font-weight: 600;
    background: var(--ink-900);
  }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; opacity: .85; }
  .statusbar .glyphs svg { display: block; }

  /* ---------- Hero (dark) ---------- */
  .hero {
    flex: 0 0 auto;
    background: linear-gradient(165deg, var(--ink-900), var(--ink-800) 70%);
    padding: 18px 22px 22px;
    color: var(--ink-on-dark);
    border-radius: 0 0 26px 26px;
  }

  .farm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .farm-id { display: flex; align-items: center; gap: 8px; }
  .eyebrow {
    display: block;
    font-size: 9.5px;
    font-weight: 750;
    letter-spacing: .14em;
    color: var(--wheat-gold);
    margin: 0 0 3px;
  }
  .farm-name-row { display: flex; align-items: center; gap: 6px; }
  .farm-name-row strong { font-family: 'Space Grotesk', sans-serif; font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
  .farm-name-row svg { opacity: .55; margin-top: 1px; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--clay);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.25);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .avatar:focus-visible { outline: 2px solid var(--wheat-gold); outline-offset: 2px; }

  .greeting {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.02em;
    margin: 16px 0 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .greeting svg { color: var(--wheat-gold); }

  /* ---------- Sync card — the signature "furrow" element ---------- */
  .sync-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 14px 15px 15px;
  }
  .sync-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .sync-label { font-size: 13.5px; font-weight: 600; color: var(--ink-on-dark); }
  .sync-time { font-size: 10.5px; color: var(--muted-on-dark); }

  .furrow-track {
    position: relative;
    height: 11px;
    border-radius: 6px;
    overflow: hidden;
    background:
      repeating-linear-gradient(128deg, rgba(255,255,255,0.07) 0 3px, transparent 3px 8px),
      rgba(255,255,255,0.06);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .furrow-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background:
      repeating-linear-gradient(128deg, rgba(0,0,0,0.16) 0 3px, transparent 3px 8px),
      linear-gradient(90deg, var(--clay-dark), var(--clay));
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.25);
    transition: width 1.1s cubic-bezier(.16,.84,.44,1);
  }

  .sync-btn {
    width: 100%;
    margin-top: 13px;
    padding: 11px;
    border: 0;
    border-radius: 10px;
    background: var(--clay);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .sync-btn:hover { background: var(--clay-dark); }
  .sync-btn:active { transform: scale(0.98); }
  .sync-btn:focus-visible { outline: 2px solid var(--wheat-gold); outline-offset: 2px; }

  /* ---------- Content ---------- */
  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 22px 18px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
    margin-bottom: 26px;
  }
  .tile {
    border: 0;
    border-radius: 16px;
    padding: 18px 14px;
    text-align: left;
    display: flex; flex-direction: column; gap: 22px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 650;
    transition: transform .15s ease;
    position: relative;
    overflow: hidden;
  }
  .tile:active { transform: scale(0.97); }
  .tile:focus-visible { outline: 2px solid var(--ink-900); outline-offset: 2px; }
  .tile-primary {
    background: var(--clay);
    color: #fff;
  }
  .tile-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(128deg, rgba(0,0,0,0.08) 0 3px, transparent 3px 9px);
    pointer-events: none;
  }
  .tile-secondary {
    background: var(--paper-raised);
    color: var(--ink-900);
    border: 1.5px solid var(--line);
  }
  .tile-icon { width: 30px; height: 30px; }
  .tile span:last-child { position: relative; z-index: 1; }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-head .eyebrow { color: var(--clay-dark); margin: 0; }
  .count-pill {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-700);
    background: rgba(22,48,42,0.07);
    padding: 4px 9px;
    border-radius: 20px;
  }

  .order-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .order-card:hover { border-color: rgba(22,48,42,0.28); }
  .order-card:active { transform: scale(0.985); }

  .order-icon {
    width: 40px; height: 40px;
    border-radius: 11px;
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .tone-blue .order-icon  { background: var(--tone-blue-bg);  color: var(--tone-blue); }
  .tone-amber .order-icon { background: var(--tone-amber-bg); color: var(--tone-amber); }

  .order-info { flex: 1; min-width: 0; }
  .order-info strong {
    display: block;
    font-size: 14px;
    color: var(--ink-900);
    font-weight: 650;
  }
  .order-info span {
    display: block;
    font-size: 11.5px;
    color: var(--muted-on-paper);
    margin-top: 3px;
  }

  .order-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .status-blue  { color: var(--tone-blue);  background: var(--tone-blue-bg); }
  .status-amber { color: var(--tone-amber); background: var(--tone-amber-bg); }
  .time-text { font-size: 10.5px; color: var(--muted-on-paper); }

  /* ---------- Tab bar ---------- */
  .tabbar {
    flex: 0 0 auto;
    display: flex;
    background: var(--ink-900);
    padding: 10px 6px 6px;
  }
  .tab {
    flex: 1;
    border: 0;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 4px 0 8px;
    color: var(--muted-on-dark);
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .tab svg { width: 21px; height: 21px; }
  .tab.active { color: var(--ink-on-dark); }
  .tab.active::before {
    content: '';
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    width: 18px; height: 3px;
    border-radius: 2px;
    background: var(--clay);
  }
  .tab:focus-visible { outline: 2px solid var(--wheat-gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .furrow-fill, .sync-btn, .tile, .order-card { transition: none !important; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="glyphs">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="2.6" height="5" rx="0.6" fill="currentColor"/><rect x="4.3" y="4" width="2.6" height="7" rx="0.6" fill="currentColor"/><rect x="8.6" y="2" width="2.6" height="9" rx="0.6" fill="currentColor"/><rect x="12.9" y="0" width="2.6" height="11" rx="0.6" fill="currentColor" opacity=".45"/></svg>
        <svg width="20" height="11" viewBox="0 0 20 11" fill="none"><rect x="0.5" y="0.5" width="16.5" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="12" height="7" rx="1.2" fill="currentColor"/><rect x="18" y="3.5" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
      </span>
    </div>

    <header class="hero">
      <div class="farm-row">
        <div class="farm-id">
          <div>
            <span class="eyebrow">ESTABLECIMIENTO</span>
            <div class="farm-name-row">
              <strong>La Arboleda</strong>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>
        <button class="avatar" aria-label="Perfil de Martín Ríos">MR</button>
      </div>

      <p class="greeting">
        Buen día, Martín
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="3" x2="12" y2="21"/>
          <line x1="12" y1="6" x2="8" y2="3"/><line x1="12" y1="6" x2="16" y2="3"/>
          <line x1="12" y1="10.5" x2="8" y2="7.5"/><line x1="12" y1="10.5" x2="16" y2="7.5"/>
          <line x1="12" y1="15" x2="8" y2="12"/><line x1="12" y1="15" x2="16" y2="12"/>
        </svg>
      </p>

      <div class="sync-card">
        <div class="sync-top">
          <span class="sync-label">3 cambios sin subir</span>
          <span class="sync-time mono">Últ. sync 09:42</span>
        </div>
        <div class="furrow-track">
          <div class="furrow-fill" id="furrowFill"></div>
        </div>
        <button class="sync-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5"/>
            <path d="M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"/>
          </svg>
          Sincronizar ahora
        </button>
      </div>
    </header>

    <main class="content">
      <div class="quick-actions">
        <button class="tile tile-primary">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="17" r="3.2"/><circle cx="18" cy="17" r="2.4"/>
            <path d="M7 17V8h6l4 4h3v5"/><path d="M13 8V5H4"/>
          </svg>
          <span>Nueva orden</span>
        </button>
        <button class="tile tile-secondary">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4C11 4 4 11 4 20c9 0 16-7 16-16z"/>
            <path d="M6.5 17.5C10 13.5 14 9.5 18.5 5.5"/>
          </svg>
          <span>Registrar hallazgo</span>
        </button>
      </div>

      <section class="orders">
        <div class="section-head">
          <span class="eyebrow">HOY</span>
          <span class="count-pill">2 activas</span>
        </div>

        <article class="order-card tone-blue">
          <div class="order-icon">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3C12 3 6 11 6 15a6 6 0 0 0 12 0c0-4-6-12-6-12z"/>
            </svg>
          </div>
          <div class="order-info">
            <strong>Pulverización</strong>
            <span>Lote Norte · <span class="mono">48 ha</span></span>
          </div>
          <div class="order-meta">
            <span class="status status-blue">En curso</span>
            <span class="time-text mono">08:40</span>
          </div>
        </article>

        <article class="order-card tone-amber">
          <div class="order-icon">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <circle cx="9" cy="8" r="1.8" fill="currentColor"/>
              <circle cx="15.5" cy="9.5" r="1.8" fill="currentColor"/>
              <circle cx="11.5" cy="15" r="1.8" fill="currentColor"/>
            </svg>
          </div>
          <div class="order-info">
            <strong>Fertilización</strong>
            <span>La Loma · <span class="mono">32 ha</span></span>
          </div>
          <div class="order-meta">
            <span class="status status-amber">Pendiente</span>
            <span class="time-text mono">Mañana 07:00</span>
          </div>
        </article>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Inicio
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="3" height="3" rx="0.6"/><line x1="9" y1="6.5" x2="21" y2="6.5"/><rect x="3" y="10.5" width="3" height="3" rx="0.6"/><line x1="9" y1="12" x2="21" y2="12"/><rect x="3" y="16" width="3" height="3" rx="0.6"/><line x1="9" y1="17.5" x2="18" y2="17.5"/></svg>
        Órdenes
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C11 4 4 11 4 20c9 0 16-7 16-16z"/><path d="M6.5 17.5C10 13.5 14 9.5 18.5 5.5"/></svg>
        Scouting
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="12" y1="6" x2="8" y2="3"/><line x1="12" y1="6" x2="16" y2="3"/><line x1="12" y1="10.5" x2="8" y2="7.5"/><line x1="12" y1="10.5" x2="16" y2="7.5"/><line x1="12" y1="15" x2="8" y2="12"/><line x1="12" y1="15" x2="16" y2="12"/></svg>
        Ganado
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
        Más
      </button>
    </nav>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
  const fill = document.getElementById('furrowFill');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(() => {
    if (reduce) {
      fill.style.transition = 'none';
      fill.style.width = '70%';
    } else {
      setTimeout(() => { fill.style.width = '70%'; }, 250);
    }
  });
</script>

</body>
</html>
